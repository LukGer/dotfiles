# gh-dash, run by `ghd`. Keys and scripts are explained in ghd/README.md.
prSections:
  - title: My Open PRs
    filters: is:open author:@me archived:false
  - title: Review requested
    filters: is:open review-requested:@me archived:false
  - title: Involved
    filters: is:open involves:@me -author:@me archived:false
defaults:
  preview:
    open: true
    width: 70
  prsLimit: 30
  refetchIntervalMinutes: 5
pager:
  diff: ghd pager
keybindings:
  universal:
    - key: up
      builtin: up
    - key: down
      builtin: down
    - key: j
      builtin: pageDown
    - key: k
      builtin: pageUp
  prs:
    - key: O
      name: open deployment
      command: ghd open popup ghd deployment {{.RepoName}} {{.PrNumber}}
    - key: i
      name: full info in new tab
      command: ghd open tab ghd info {{.RepoName}} {{.PrNumber}}
    - key: ctrl+g
      name: Opus 5.5 review (pi)
      command: ghd open popup ghd review {{.RepoName}} {{.PrNumber}} pi anthropic/claude-opus-5-5:high
    - key: ctrl+t
      name: GPT-6.1 Sol high review (pi)
      command: ghd open popup ghd review {{.RepoName}} {{.PrNumber}} pi openai-codex/gpt-6.1-sol:high
    - key: f
      name: review menu
      command: tmux run-shell -b 'ghd review {{.RepoName}} {{.PrNumber}}'
    - key: E
      name: past reviews
      command: ghd open popup ghd history
    - key: ctrl+o
      name: post review
      command: ghd open popup ghd post {{.RepoName}} {{.PrNumber}}
    - key: D
      name: diff in new tab
      command: ghd open tab ghd diff {{.RepoName}} {{.PrNumber}}
